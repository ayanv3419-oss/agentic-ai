name: CI

# Runs every push + every PR. Two jobs:
#   - backend-tests: v1 regression suites (14) + v2 reflective-orchestrator
#                    suites (5) + boot smoke
#   - frontend-build: tsc --noEmit + vite build
#
# Tests are plain Python scripts (no pytest dep) so the workflow stays
# simple. Drop a new test path into either matrix step and CI picks it up.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Boot smoke (FastAPI app imports cleanly + new routes present)
        env:
          FINANCIAL_DB_PATH: /tmp/_ci_boot.db
          PYTHONPATH: backend
        run: |
          python -c "
          from app.core_system import app
          print(f'FastAPI routes: {len(app.routes)}')
          paths = {r.path for r in app.routes if hasattr(r, 'path')}
          assert '/auth/login' in paths, 'auth/login route missing'
          assert '/query_stream' in paths, 'query_stream route missing'
          assert '/health' in paths, 'health route missing'
          print('boot smoke OK')
          "

      - name: Run v1 regression suites
        env:
          FINANCIAL_DB_PATH: /tmp/_ci_v1_test.db
          PYTHONPATH: backend
        working-directory: backend
        run: |
          set -e
          for t in \
            test_intent_router \
            test_dashboard_pie \
            test_analytics_intent \
            test_business_intelligence \
            test_costs_and_advanced \
            test_dedup \
            test_enrichment \
            test_errors \
            test_hierarchy_v2 \
            test_mock_backfill \
            test_persistence_lifecycle \
            test_presentation_layer \
            test_restriction \
            test_time_engine
          do
            echo "::group::tests.$t"
            python -m "tests.$t"
            echo "::endgroup::"
          done

      - name: Seed v2 test DB (schema + KPI catalog + hierarchy defaults)
        env:
          FINANCIAL_DB_PATH: /tmp/_ci_v2_test.db
          PYTHONPATH: backend
        working-directory: backend
        # v2 tests don't go through core_system._startup. compute_kpi
        # (used by test_p2 + test_p4) needs the kpi_registry table to
        # exist. This step mirrors the startup boot sequence onto the
        # fresh CI DB. Idempotent.
        run: |
          python -m app.orchestrator_v2.tests._db_bootstrap

      - name: Run v2 reflective-orchestrator suites
        env:
          FINANCIAL_DB_PATH: /tmp/_ci_v2_test.db
          PYTHONPATH: backend
        working-directory: backend
        # Note: NO `set -e` here — we want every suite to run so the
        # logs show exactly which one fails instead of bailing at the
        # first. ``failed`` is accumulated and the step exits non-zero
        # at the end if any suite returned non-zero.
        run: |
          failed=0
          for t in \
            test_p1_capability_layer \
            test_p2_pipeline \
            test_p3_validators \
            test_p4_reflection \
            test_p5_memory
          do
            echo "::group::app.orchestrator_v2.tests.$t"
            if python -m "app.orchestrator_v2.tests.$t"; then
              echo "::endgroup::"
              echo "[PASS] $t"
            else
              code=$?
              echo "::endgroup::"
              echo "::error title=v2 test failure::${t} exited with code ${code}"
              failed=1
            fi
          done
          exit $failed

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build (vite)
        working-directory: frontend
        run: npx vite build
