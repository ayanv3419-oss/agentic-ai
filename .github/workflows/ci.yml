name: CI

# Runs every push + every PR. Two jobs:
#   - backend-tests: boot smoke + the pytest suite under backend/tests/
#   - frontend-build: tsc --noEmit + vite build
#
# Tests are standard pytest. Add a new test_*.py under backend/tests/ and
# CI picks it up automatically. The suite runs on SQLite (FINANCIAL_DB_PATH)
# and does not require a Postgres DATABASE_URL — the Postgres-required guard
# lives in the app's lifespan startup, which the unit tests never trigger.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Boot smoke (FastAPI app imports cleanly + core routes present)
        env:
          FINANCIAL_DB_PATH: /tmp/_ci_boot.db
          PYTHONPATH: backend
        run: |
          python -c "
          from app.core_system import app
          paths = {r.path for r in app.routes if hasattr(r, 'path')}
          assert '/auth/login' in paths, 'auth/login route missing'
          assert '/query_stream' in paths, 'query_stream route missing'
          assert '/health' in paths, 'health route missing'
          print(f'boot smoke OK - {len(app.routes)} routes')
          "

      - name: Run backend test suite (pytest)
        env:
          FINANCIAL_DB_PATH: /tmp/_ci_test.db
          PYTHONPATH: backend
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build (vite)
        working-directory: frontend
        run: npx vite build
