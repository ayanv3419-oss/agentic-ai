name: Keep the database awake

# Supabase's free tier pauses a project after ~7 days without database
# activity — which took prod down on 2026-08-03 (dashboard showed a fake
# "network error" while the DB was paused). This daily ping makes a real
# round-trip: GET /health runs `SELECT 1` on Postgres, which counts as
# activity and resets Supabase's idle clock. If the backend or database
# stops answering, the run fails and GitHub emails the repo owner.
#
# Note: GitHub auto-disables scheduled workflows after ~60 days without
# any repo activity — a push (or re-enabling it in the Actions tab)
# brings it back.

on:
  schedule:
    - cron: "23 4 * * *" # daily 04:23 UTC (~9:53 AM IST)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /health and require a live DB round-trip
        run: |
          # Render's free tier cold-starts in up to ~2 minutes; retry
          # through it rather than failing on the first slow response.
          resp=$(curl -sS --fail --retry 4 --retry-delay 25 --retry-all-errors \
                 --max-time 150 https://agentic-ai-anet.onrender.com/health)
          echo "$resp"
          echo "$resp" | jq -e '.database.reachable == true' >/dev/null \
            || { echo "::error::Database unreachable — Supabase paused or down. Restore it at supabase.com/dashboard."; exit 1; }
