services:
  - type: web
    name: agentic-ai
    runtime: python
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    disk:
      name: agentic-ai-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: FINANCIAL_DB_PATH
        value: /data/financial_records.db
      - key: RESPONSE_STORE_PATH
        value: /data/response_store.json
      - key: RELOAD
        value: "false"
      # CORS lock-down — only the deployed Vercel frontend may call this API.
      # If you redeploy to a different Vercel URL, update this here (and
      # FRONTEND_URL below) before re-pushing. "*" is forbidden in prod:
      # it lets any website on the internet hit your backend.
      - key: ALLOWED_ORIGINS
        value: https://agentic-ai-livid-eta.vercel.app
      - key: FRONTEND_URL
        value: https://agentic-ai-livid-eta.vercel.app
      # --- Auth (Phase 3) -------------------------------------------
      # Auth ON so login + sign-out work in prod. Users self-register via
      # POST /auth/signup (accounts live in the `users` table); there is no
      # separate admin login. AUTH_TOKEN_SECRET is auto-generated by Render on
      # first deploy (strong random, never committed) so the deploy can't brick
      # on a missing secret. Flip AUTH_ENABLED back to "false" to make every
      # route public again.
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_TOKEN_SECRET
        generateValue: true   # strong random token-signing secret
      # --- LLM PRIMARY = Alibaba Cloud Model Studio, Qwen ----------------
      # Qwen via Alibaba's OpenAI-compatible endpoint (chosen primary). Needs
      # Alibaba PAID mode to be reliable; until then calls fall through to the
      # Gemini fallback below. Set LLM_API_KEY (sk-...) in the Render dashboard.
      - key: LLM_BASE_URL
        value: "https://ws-cexg1r14miprmyct.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
      - key: LLM_API_KEY
        sync: false   # Alibaba Model Studio key (sk-...) — set in Render dashboard
      - key: LLM_MODEL
        value: "qwen3.6-35b-a3b"
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: LLM_MAX_TOKENS
        value: "2048"
      # --- LLM FALLBACK = Google AI Studio, Gemini ----------------------
      # Auto-used when the primary (Qwen) is rate-limited / out of quota /
      # unreachable. Set LLM_FALLBACK_API_KEY (AIza...) in the dashboard.
      - key: LLM_FALLBACK_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai"
      - key: LLM_FALLBACK_API_KEY
        sync: false   # Google AI Studio (Gemini) key (AIza...) — set in Render dashboard
      - key: LLM_FALLBACK_MODEL
        value: "models/gemini-2.5-flash"
      # --- Database (Supabase Postgres) ----------------------------------
      # When set to a postgres:// URL, the backend uses asyncpg against
      # Supabase instead of the local SQLite file on the mounted disk.
      # Get the URI from: Supabase dashboard → Project Settings →
      # Database → Connection string → URI mode. Set in Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false   # set in Render dashboard if you use Sentry
      # Google Drive OAuth — secrets only in the Render dashboard, never
      # in git. Set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET there.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false   # set to https://<backend>/auth/google/callback
