services:
  - type: web
    name: agentic-ai
    runtime: python
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    disk:
      name: agentic-ai-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: FINANCIAL_DB_PATH
        value: /data/financial_records.db
      - key: RESPONSE_STORE_PATH
        value: /data/response_store.json
      - key: RELOAD
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
        # After Vercel deploys, change this to your Vercel URL, e.g.:
        # value: https://agentic-ai-livid-eta.vercel.app
      - key: FRONTEND_URL
        value: https://agentic-ai-livid-eta.vercel.app
      # --- Auth (Phase 3) -------------------------------------------
      # Default off so a misconfigured deploy doesn't brick — flip to
      # "true" in the Render dashboard once ADMIN_USERNAME + PASSWORD
      # + AUTH_TOKEN_SECRET are also set there.
      - key: AUTH_ENABLED
        value: "false"
      - key: ADMIN_USERNAME
        sync: false   # set in Render dashboard (required when AUTH_ENABLED=true)
      - key: ADMIN_PASSWORD
        sync: false   # set in Render dashboard (required when AUTH_ENABLED=true)
      - key: AUTH_TOKEN_SECRET
        sync: false   # set in Render dashboard (required when AUTH_ENABLED=true)
      # --- LLM (Together.ai — OpenAI-compatible, runs Qwen) ----------------
      # Together.ai hosts Qwen/Qwen3-8B with an OpenAI-compatible endpoint.
      # Set LLM_API_KEY in the Render dashboard (sync: false).
      - key: LLM_BASE_URL
        value: "https://api.together.xyz/v1"
      - key: LLM_API_KEY
        sync: false   # Together.ai key — set in Render dashboard
      - key: LLM_MODEL
        value: "Qwen/Qwen3-8B"
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: LLM_MAX_TOKENS
        value: "2048"
      - key: SENTRY_DSN
        sync: false   # set in Render dashboard if you use Sentry
      # Google Drive OAuth — secrets only in the Render dashboard, never
      # in git. Set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET there.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false   # set to https://<backend>/auth/google/callback
