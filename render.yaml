services:
  - type: web
    name: agentic-ai
    runtime: python
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    disk:
      name: agentic-ai-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: FINANCIAL_DB_PATH
        value: /data/financial_records.db
      - key: RESPONSE_STORE_PATH
        value: /data/response_store.json
      - key: RELOAD
        value: "false"
      # CORS lock-down — only the deployed Vercel frontend may call this API.
      # If you redeploy to a different Vercel URL, update this here (and
      # FRONTEND_URL below) before re-pushing. "*" is forbidden in prod:
      # it lets any website on the internet hit your backend.
      - key: ALLOWED_ORIGINS
        value: https://agentic-ai-livid-eta.vercel.app
      - key: FRONTEND_URL
        value: https://agentic-ai-livid-eta.vercel.app
      # --- Auth (Phase 3) -------------------------------------------
      # Default off so a misconfigured deploy doesn't brick — flip to
      # "true" in the Render dashboard once ADMIN_USERNAME + PASSWORD
      # + AUTH_TOKEN_SECRET are also set there.
      - key: AUTH_ENABLED
        value: "false"
      - key: ADMIN_USERNAME
        sync: false   # set in Render dashboard (required when AUTH_ENABLED=true)
      - key: ADMIN_PASSWORD
        sync: false   # set in Render dashboard (required when AUTH_ENABLED=true)
      - key: AUTH_TOKEN_SECRET
        sync: false   # set in Render dashboard (required when AUTH_ENABLED=true)
      # --- LLM (OpenRouter — free Qwen, OpenAI-compatible) -----------------
      # OpenRouter aggregates dozens of providers behind one OpenAI-compatible
      # endpoint and offers Qwen models on a free tier (50 req/day @ $0
      # balance, 1000 req/day with $10+ unused credit, 20 req/min cap).
      # Globally accessible — works from networks where Together.ai or
      # DashScope are blocked.  Sign up at https://openrouter.ai/keys.
      - key: LLM_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: LLM_API_KEY
        sync: false   # OpenRouter key (sk-or-...) — set in Render dashboard
      - key: LLM_MODEL
        value: "qwen/qwen3-coder:free"
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: LLM_MAX_TOKENS
        value: "2048"
      # --- Database (Supabase Postgres) ----------------------------------
      # When set to a postgres:// URL, the backend uses asyncpg against
      # Supabase instead of the local SQLite file on the mounted disk.
      # Get the URI from: Supabase dashboard → Project Settings →
      # Database → Connection string → URI mode. Set in Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false   # set in Render dashboard if you use Sentry
      # Google Drive OAuth — secrets only in the Render dashboard, never
      # in git. Set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET there.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false   # set to https://<backend>/auth/google/callback
